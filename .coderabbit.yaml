      instructions: "用中文评审。重点关注：WindowsApps 权限与 ACL 处理、提权流程、备份与恢复的可逆性、补丁正则匹配数量，以及内嵌 Python 引擎的 Windows 兼容性。"
chat:
  auto_reply: true
