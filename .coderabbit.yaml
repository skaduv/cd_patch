# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 配置：所有评审、总结与回复使用简体中文。
language: "zh-CN"
tone_instructions: "请始终使用简体中文撰写所有评审评论、总结、建议与聊天回复；代码、命令、路径和标识符保持原样。"
reviews:
  profile: "chill"
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
